name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
      - run: python -m pip install ruff==0.16.8 mypy==2.3.1
      - run: ruff check . && ruff format --check . && mypy packdelta
      - name: Clean install and real CLI
        run: |
          python -m venv --without-pip .venv
          .venv/bin/python tools/build_zipapp.py
          .venv/bin/python examples/make_demo.py
          .venv/bin/python dist/packdelta.pyz dist/demo/before.tgz dist/demo/after.tgz --fail-on never
          .venv/bin/python -m unittest discover -s tests -v
